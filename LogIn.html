<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="Login.css" />
    <title>StaffFlow</title>
    <link rel="icon" href="icon.png" />
  </head>
  <body>
    <div class="bord">
      <div class="leftside">
        <h1 class="header">StaffFlow</h1>
        <img id="icon" src="icon.png" alt="icon" />
        <div class="idNumer">
          <p style="color: green"><b>Employee's ID</b></p>
          <input
            placeholder="Employee's ID"
            id="idNumber "
            type="text"
            class="input"
          />
        </div>
        <div class="password">
          <p style="color: green"><b>Password</b></p>
          <input id="password" type="password" class="input" />
          <button id="eye-icon" type="button">👁</button>
          <a href="forgot.html" id="forgot" class="forgot">Forgot Password</a>
        </div>
      </div>
      <button id="clickSignIn">Sign In</button>
      <button type="button" id="signin">Sign In</button>

      <div class="signup-border"></div>

      <h1 style="color: aliceblue" class="greetings">
        Ready to Manage Your Tasks?
      </h1>
      <h3 id="description" style="color: white" class="mama">
        No account yet? Create one here.
      </h3>
      <button id="clickSignUP" type="button">Sign up</button>
      <div class="righside">
        <div class="inputs">
          <h1 class="header-rightside">Already Have An Account?</h1>
          <h3 id="left-description">Click Log In to continue.</h3>
          <input
            class="all-right"
            type="text"
            id="firstName"
            placeholder="First Name"
          />
          <input
            class="all-right"
            type="text"
            id="lastName"
            placeholder="Last Name"
          />
          <input
            class="all-right"
            type="number"
            id="id"
            placeholder="ID number"
          />
          <input
            class="all-right"
            type="password"
            id="rightPassword"
            placeholder="Enter Password"
          />
          <input
            class="all-right"
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
          />
          <button type="submit" id="legitNaSignUp">Sign Up</button>
        </div>
      </div>
    </div>
    <script src="login.js"></script>
  </body>
</html>

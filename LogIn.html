<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="Login.css" />
    <title>StaffFlow</title>
    <link rel="icon" href="icon.png" />
  </head>
  <body>
    <div class="bord">
      <h1 class="header">StaffFlow</h1>
      <img id="icon" src="icon.png" alt="icon" />
      <div class="email">
        <p style="color: green"><b>Email</b></p>
        <input
          placeholder="ReneBatterbonia@gmail.com"
          id="email "
          type="email"
          class="input"
        />
      </div>
      <div class="password">
        <p style="color: green"><b>Password</b></p>
        <input id="password" type="password" class="input" />
        <button id="eye-icon" type="button">👁</button>
        <a href="forgot.html" class="forgot">Forgot Password</a>
      </div>
      <button type="button" id="signin">Sign In</button>

      <div class="signup-border">
        <h1 style="color: aliceblue" class="greetings">Welcome back!</h1>
        <h3 id="description" style="color: white" class="mama">
          Work smarter. Stay organized. Keep everything flowing.
        </h3>

        <button id="sign-up-button" type="button">Sign up</button>
      </div>
    </div>
    <script src="login.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/Login.css" />
    <title>Staff Flow</title>
    <link rel="icon" href="image/icon.png" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div class="bord">
      <div class="leftside">
        <h1 class="header">Welcome back!</h1>
        <p class="semi-header">Sign in to your StaffFlow workspace.</p>
        <img id="icon" src="image/icon.png" alt="icon" />
        <div class="idNumer">
          <label>Account ID</label>
          <input
            placeholder="Employee's ID"
            id="idNumber"
            type="text"
            class="input"
          />
          <i data-lucide="user"></i>
        </div>
        <div class="password">
          <label>Password</label>
          <input id="password" type="password" class="input" />
          <i id="lock" data-lucide="lock"></i>
          <button id="eye-icon" type="button">
            <i data-lucide="eye"></i>
          </button>
        </div>
        <p id="loginMessage" role="status"></p>
      </div>
      <button id="clickSignIn">Sign In</button>
      <button type="button" id="signin">Sign In</button>

      <div class="signup-border"></div>

      <h1 id="readytomanage" style="color: aliceblue" class="greetings">
        Ready to Manage Your Tasks?
      </h1>
      <h3 id="description" style="color: white" class="mama">
        Don't have an account? Sign up and join your team.
      </h3>
      <button id="clickSignUP" type="button">Sign up</button>
      <div class="rightside" style="visibility: hidden">
        <div class="inputs">
          <h1 class="header-rightside">Already Have An Account?</h1>
          <h1 id="fillup">Create your account</h1>
          <h3 id="left-description">Sign in to pick where you left off .</h3>
          <p id="paragrapht-na-gamay">Fill in your details to get started.</p>
          <div class="name-section">
            <div class="firstname-section">
              <label>First name</label>
              <input
                class="all-right"
                type="text"
                id="firstName"
                placeholder="First Name"
              />
              <i data-lucide="user"></i>
            </div>
            <div class="lastname-section">
              <label>Last name</label>
              <input
                class="all-right"
                type="text"
                id="lastName"
                placeholder="Last Name"
              />
              <i data-lucide="user"></i>
            </div>
          </div>
          <div class="threeinputs">
            <div class="accountnumber-section">
              <label>Account ID</label>
              <input
                class="all-right"
                type="text"
                id="id"
                placeholder="ID number"
              />
              <i data-lucide="id-card"></i>
            </div>
            <div class="password-section">
              <label>Password</label>
              <input
                class="all-right"
                type="password"
                id="rightPassword"
                placeholder="Enter Password"
              />
              <i data-lucide="lock"></i>
            </div>
            <div class="select-role-border">
              <label for="selec-role">Account Role</label>
              <select name="role" id="selec-role">
                <option value="admin">Admin</option>
                <option value="manager">Manager</option>
                <option value="employee">Employee</option>
              </select>
              <i data-lucide="badge-check"></i>
            </div>
            <button type="submit" id="legitNaSignUp">Sign Up</button>
          </div>
        </div>
      </div>
    </div>
    <script src="js/login.js"></script>
    <script src="js/signup.js"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>

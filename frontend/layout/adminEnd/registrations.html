<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../css/format.css" />
    <link rel="stylesheet" href="../../css/adminFT.css" />
    <link rel="stylesheet" href="../../css/hover.css" />
    <link rel="icon" href="../../image/icon.png" />
    <title>StaffFlow</title>

    <script src="https://unpkg.com/lucide@latest"></script>
  </head>

  <body>
    <div id="sideBar">
      <div class="logo">
        <a href="registrations.html">
          <img class="stafflow" src="../../image/icon.png" alt="Icon"
        /></a>
        <h1 id="StaffFlow" class="stafflow">StaffFlow</h1>
      </div>
      <label id="menu">Menu</label>
      <nav id="side-nav">
        <div class="box-hover"></div>
        <a href="dashboared.html">
          <i data-lucide="house"></i>
          <span>Home</span>
        </a>

        <a href="registrations.html">
          <i data-lucide="user-plus"></i>
          <span>Registrations</span>
        </a>

        <a href="manage.html">
          <i data-lucide="users"></i>
          <span>Manage Accounts</span>
        </a>

        <a href="setting.html">
          <i data-lucide="settings"></i>
          <span>Settings</span>
        </a>

        <button id="log-out">
          <i data-lucide="log-out"></i>
          <span>Leave Workspace</span>
        </button>
      </nav>
      <dialog id="logout-button">
        <div class="box-logout">
          <div class="logout-border">
            <i data-lucide="log-out"></i>
          </div>
          <h3>Log out of StaffFlow?</h3>
          <p>
            Are you sure do you want to log out? You'll need to sign in again to
            view your work.
          </p>
          <div class="choices">
            <button type="button" id="yes-btn">Yes</button>
            <button type="button" id="no-btn">No</button>
          </div>
        </div>
      </dialog>
    </div>
    <div class="topbar">
      <div class="greetings">
        <strong>Resgistrations</strong>
        <p>ADMIN WORKSPACE</p>
      </div>
    </div>
    <main class="main-admin">
      <div class="kahon-2">
        <div class="upper-stuff">
          <h2 class="header-registration">Registration Requests</h2>
          <span id="pending-count">0 Pending</span>
        </div>

        <div class="registration-labels">
          <span>Name</span>
          <span>Requested Role</span>
          <span>Date Submitted</span>
          <span>Status</span>
          <span>Actions</span>
        </div>

        <div class="registration-list" id="registration-list">
          <template id="registration-template">
            <div class="registration-row">
              <div class="registration-user">
                <div class="registration-initials"></div>
                <p class="registration-name"></p>
              </div>

              <p class="requested-role"></p>

              <p class="registration-date"></p>

              <p class="registration-status">Pending</p>

              <div class="registration-actions">
                <button type="button" class="approve-request">Approve</button>

                <button type="button" class="reject-request">Reject</button>
              </div>
            </div>
          </template>
        </div>
      </div>

      <div class="registration-column"></div>
    </main>
    <script>
      lucide.createIcons();
    </script>
    <script src="../../js/hover.js"></script>
    <script src="../../js/logout.js"></script>
    <script src="../../js/register.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../css/format.css" />
    <link rel="stylesheet" href="../../css/hover.css" />
    <link rel="stylesheet" href="../../css/employeeFT.css" />
    <link rel="icon" href="../../image/icon.png" />
    <title>StaffFlow</title>

    <script src="https://unpkg.com/lucide@latest"></script>
  </head>

  <body>
    <div id="sideBar">
      <div class="logo">
        <div class="bottomcircle"></div>
        <div class="topcircle"></div>

        <a href="settings.html">
          <img class="stafflow" src="../../image/icon.png" alt="Icon"
        /></a>
        <h1 id="StaffFlow" class="stafflow">StaffFlow</h1>
      </div>
      <label id="menu">Menu</label>
      <nav id="side-nav">
        <div class="box-hover"></div>
        <a href="employedash.html">
          <i data-lucide="house"></i>
          <span>Home</span>
        </a>

        <a href="myTeam.html">
          <i data-lucide="user-plus"></i>
          <span>My Team</span>
        </a>

        <a href="myTask.html">
          <i data-lucide="users"></i>
          <span>My Tasks</span>
        </a>

        <a href="settings.html">
          <i data-lucide="settings"></i>
          <span>Settings</span>
        </a>

        <button id="log-out">
          <i data-lucide="log-out"></i>
          <span>Leave Workspace</span>
        </button>
      </nav>
      <dialog id="logout-button">
        <div class="box-logout">
          <div class="logout-border">
            <i data-lucide="log-out"></i>
          </div>
          <h3>Log out of StaffFlow?</h3>
          <p>
            Are you sure do you want to log out? You'll need to sign in again to
            view your work.
          </p>
          <div class="choices">
            <button id="yes-btn">Yes</button>
            <button id="no-btn">No</button>
          </div>
        </div>
      </dialog>
    </div>
    <div class="topbar">
      <div class="greetings">
        <strong>Home</strong>
        <p>EMPLOYEE WORKSPACE</p>
      </div>
    </div>
    <main>
      <p id="hello">Good Day Employee!</p>
      <p id="here">Here's what's happening today</p>
    </main>
    <script>
      lucide.createIcons();
    </script>
    <script src="../../js/hover.js"></script>
  </body>
</html>

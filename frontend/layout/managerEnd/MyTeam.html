<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../css/format.css" />
    <link rel="stylesheet" href="../../css/hover.css" />
    <link rel="stylesheet" href="../../css/managerFT.css" />
    <link rel="icon" href="../../image/icon.png" />
    <title>StaffFlow</title>

    <script src="https://unpkg.com/lucide@latest"></script>
  </head>

  <body>
    <div id="sideBar">
      <div class="logo">
        <div class="bottomcircle"></div>
        <div class="topcircle"></div>

        <a href="manager.html">
          <img class="stafflow" src="../../image/icon.png" alt="Icon"
        /></a>
        <h1 id="StaffFlow" class="stafflow">StaffFlow</h1>
      </div>
      <label id="menu">Menu</label>
      <nav id="side-nav">
        <div class="box-hover"></div>
        <a href="manager.html">
          <i data-lucide="house"></i>
          <span>Home</span>
        </a>

        <a href="MyTeam.html">
          <i data-lucide="user-plus"></i>
          <span>My Team</span>
        </a>

        <a href="task.html">
          <i data-lucide="users"></i>
          <span>Manage Tasks</span>
        </a>

        <a href="settings.html">
          <i data-lucide="settings"></i>
          <span>Settings</span>
        </a>

        <a id="log-out">
          <i data-lucide="log-out"></i>
          <span>Leave Workspace</span>
        </a>
      </nav>
    </div>
    <div class="topbar">
      <div class="greetings">
        <strong>Home</strong>
        <p>EMPLOYEE WORKSPACE</p>
      </div>
    </div>
    <main class="main-myteam">
      <div class="boxteam">
        <div class="info-generate">
          <div class="iconborder">
            <i id="key" data-lucide="key"></i>
          </div>
          <h2>Generate Team Code</h2>
          <p>
            Create a team and share its unique access code so members can join!
          </p>
        </div>
        <div class="generate-input">
          <label id="teamlabel" for="team-name">Team name</label>

          <input
            type="text"
            id="team-name"
            placeholder="e.g. Operation Team"
            maxlength="30"
          />

          <button type="button" id="generate-btn">Generate Code</button>
        </div>
      </div>
      <div class="myteam-header">
        <h1>Teams Created By You</h1>
        <p>Team</p>
      </div>

      <ul id="team-list" class="team-list"></ul>
      <template id="team-template">
        <li class="team-card">
          <div class="template-box">
            <div class="team-info">
              <strong class="team-name"></strong>
              <p class="team-meta">
                Access code: <code class="team-code"></code> ·
                <span class="team-members"></span>
              </p>
            </div>

            <div class="team-actions">
              <button type="button" class="btn-copy">Copy code</button>
              <button type="button" class="btn-delete">
                <i data-lucide="trash-2"></i>
              </button>
              <a class="btn-details" href="#">Team details</a>
            </div>
          </div>
        </li>
      </template>
    </main>
    <script>
      lucide.createIcons();
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../../js/hover.js"></script>
    <script src="../../js/manager.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../css/format.css" />
    <link rel="stylesheet" href="../../css/hover.css" />
    <link rel="stylesheet" href="../../css/managerFT.css" />
    <link rel="icon" href="../../image/icon.png" />
    <title>StaffFlow</title>

    <script src="https://unpkg.com/lucide@latest"></script>
  </head>

  <body>
    <div id="sideBar">
      <div class="logo">
        <div class="bottomcircle"></div>
        <div class="topcircle"></div>

        <a href="manager.html">
          <img class="stafflow" src="../../image/icon.png" alt="Icon"
        /></a>
        <h1 id="StaffFlow" class="stafflow">StaffFlow</h1>
      </div>
      <label id="menu">Menu</label>
      <nav id="side-nav">
        <div class="box-hover"></div>
        <a href="manager.html">
          <i data-lucide="house"></i>
          <span>Home</span>
        </a>

        <a href="MyTeam.html">
          <i data-lucide="user-plus"></i>
          <span>My Team</span>
        </a>

        <a href="task.html">
          <i data-lucide="users"></i>
          <span>Manage Tasks</span>
        </a>

        <a href="settings.html">
          <i data-lucide="settings"></i>
          <span>Settings</span>
        </a>

        <button id="log-out">
          <i data-lucide="log-out"></i>
          <span>Leave Workspace</span>
        </button>
      </nav>
      <dialog id="logout-button">
        <div class="box-logout">
          <div class="logout-border">
            <i data-lucide="log-out"></i>
          </div>
          <h3>Log out of StaffFlow?</h3>
          <p>
            Are you sure do you want to log out? You'll need to sign in again to
            view your work.
          </p>
          <div class="choices">
            <button type="button" id="yes-btn">Yes</button>
            <button type="button" id="no-btn">No</button>
          </div>
        </div>
      </dialog>
    </div>
    <div class="topbar">
      <div class="greetings">
        <strong>Home</strong>
        <p>MANAGER WORKSPACE</p>
      </div>
      <div class="right-side-section">
        <input type="search" placeholder="Search Tasks Or Teams" />
        <div class="border-ni-ambot-basta-ari-lang-sa-ni">
          <button class="notif-btn" type="button">
            <i data-lucide="bell-ring"></i>
          </button>
        </div>
        <div class="account-section-topbar">
          <div class="circle-sa-icon">
            <i class="account-user" data-lucide="user"></i>
          </div>
          <div class="label-sa-account">
            <p class="Employename">Franz Ryle Idul</p>
            <p class="account-role">Manager</p>
          </div>
        </div>
      </div>
    </div>
    <main class="main-myteam">
      <div class="main-box-myTask">
        <div class="mytask-box-top">
          <h2>Task Management</h2>
          <input type="search" placeholder="Search" />
          <button id="new-task">+ New Task</button>
        </div>
      </div>

      <dialog id="task-dialog" class="task-dialog">
        <div class="header-sa-dialog">
          <div class="border-icon-dialog">
            <i data-lucide="clipboard-check"></i>
          </div>

          <h1>Create Task</h1>
          <button type="button" id="close-task" class="close-task">
            &times;
          </button>
        </div>
        <div class="fill-up-area">
          <div class="task-title">
            <label for="title">Task Title</label>
            <input
              type="text"
              id="title"
              placeholder="e.g. Prepare weekly report"
            />
          </div>

          <div class="description-box-mytask">
            <label for="description">Description</label>
            <textarea
              id="description"
              name="description"
              placeholder="Add details so your team knows what to do"
            ></textarea>
          </div>
        </div>

        <div class="assigning-area">
          <div class="task-field">
            <label for="team">Team</label>
            <select id="team" name="team">
              <option value="">Select Team</option>
            </select>
          </div>

          <div class="task-field">
            <label>Select Team Members</label>

            <div id="member-selection">
              <p class="member-placeholder">Select a team first.</p>
            </div>
          </div>

          <div class="task-field">
            <label for="priority">Priority</label>
            <select name="priority" id="priority">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </div>

          <div class="task-field">
            <label for="deadline">Due Date</label>
            <input type="date" id="deadline" name="deadline" required />
          </div>
        </div>
        <div class="attach-file-area">
          <label for=""> <b>File Attachment</b> <span>(optional)</span></label>
          <div class="box-sa-file">
            <input id="input-file" type="file" />
            <button>remove</button>
          </div>
        </div>
      </dialog>
    </main>
    <script>
      lucide.createIcons();
    </script>
    <script src="../../js/manager.js"></script>
    <script src="../../js/hover.js"></script>
    <script src="../../js/logout.js"></script>
    <script src="../../js/task.js"></script>
  </body>
</html>
